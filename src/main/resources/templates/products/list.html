<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Shop — Lab 8</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>🛍️ Product Shop <span class="badge">Lab 8 — 1:1 &amp; 1:N Relationship</span></h1>

    <!-- Success message -->
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <a th:href="@{/products/add}" class="btn btn-primary">+ เพิ่มสินค้าใหม่</a>

    <table class="table">
        <thead>
        <tr>
            <th>#</th>
            <th>ชื่อสินค้า</th>
            <th>หมวดหมู่</th>
            <th>ยี่ห้อ</th>
            <th>คลัง</th>
            <th>ราคา (บาท)</th>
            <th>ส่วนลด</th>
            <th>ราคาสุทธิ</th>
            <th>รับประกัน (1:1)</th>
            <th>น้ำหนัก (1:1)</th>
            <th>รีวิว (1:N)</th>
            <th>จัดการ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category}"></td>
            <td th:text="${product.brand}"></td>
            <td th:text="${product.stock}"></td>
            <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></td>
            <td th:text="${product.discountType}"></td>
            <td th:text="${#numbers.formatDecimal(product.discountedPrice, 1, 2)}"></td>
            <td th:text="${product.detail != null ? product.detail.warranty : '-'}"></td>
            <td th:text="${product.detail != null ? product.detail.weight : '-'}"></td>
            <td th:text="${product.reviews != null ? product.reviews.size() + ' รีวิว' : '0 รีวิว'}"></td>
            <td>
                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-warning">แก้ไข</a>
                <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger">ลบ</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="12" class="text-center">ยังไม่มีสินค้า — กด "+ เพิ่มสินค้าใหม่" เพื่อเริ่มต้น</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
